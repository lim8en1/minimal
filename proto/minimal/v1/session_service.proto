syntax = "proto3";

package minimal.v1;

import "minimal/v1/common.proto";
import "google/protobuf/struct.proto";

// --- Client -> server payloads ---

message UserChatTurn {
  string text = 1; // v1 is text-only; structured content (pasted images, etc.) is future scope
  // PER-TURN overrides: this one turn runs on the given model
  // ("<provider>/<model>") and/or agent preset, resolved at pop; the
  // session's sticky choices are untouched. Unknown names fail the turn
  // with a named error, never a silent fall-back.
  optional string model = 2;
  optional string agent_preset = 3;
}

message CommandArgs {
  repeated string positional = 1;
  // Currently unconsumed (reserved): no client sends flags and no server
  // command reads them; kept for wire compatibility.
  map<string, string> flags = 2;
  string raw = 3;
}

message CommandInvocation {
  string request_id = 1; // client-generated; echoed back on CommandResult
  string name = 2;       // e.g. "compact", without the leading '/'
  CommandArgs args = 3;
}

enum PermissionDecision {
  PERMISSION_DECISION_UNSPECIFIED = 0;
  PERMISSION_DECISION_ALLOW = 1;
  PERMISSION_DECISION_DENY = 2;
}

message PermissionResponse {
  string request_id = 1; // echoes the server-generated id from PermissionRequest
  PermissionDecision decision = 2;
  // Grants the operator chose to remember for this session. Every entry must be
  // a key the corresponding PermissionRequest offered -- the server drops
  // anything else rather than trusting a client to invent grant keys.
  repeated string granted_keys = 3;
  // DENY only (ignored on ALLOW): what the operator wants the model to do
  // instead. Rides into the denial's tool result verbatim, so the model can
  // adapt instead of guessing why it was refused.
  string deny_message = 4;
  // DENY only (ignored on ALLOW): end the turn after this round instead of
  // handing the denial back to the model for another provider call. The
  // round's other calls do not run (none has started -- gating precedes all
  // execution); the turn reports STOP_REASON_CANCELLED.
  bool stop_turn = 5;
}

message ConfirmationResponse {
  string request_id = 1; // echoes the server-generated id from ConfirmationRequest
  string chosen_option = 2;
}

// --- Plugin prompts (ARCHITECTURE.md "Plugin prompts") ---
//
// A tool parks the session worker on a blocking question to the human whose
// SHAPE belongs to a plugin: core carries an opaque JSON payload tagged with a
// `kind`, and the client routes it to the prompt renderer a client plugin
// registered for that kind (the tool-ask/ask-view pair's "ask" is the bundled
// one). Core owns only the mechanism -- register-before-publish, first answer
// wins, PromptResolvedEvent, the unattended timeout, the Waiting state -- and
// never parses either JSON side.

enum PromptOutcome {
  PROMPT_OUTCOME_UNSPECIFIED = 0; // read as UNAVAILABLE
  PROMPT_OUTCOME_ANSWERED = 1;    // answer_json holds the plugin's answer
  PROMPT_OUTCOME_DISMISSED = 2;   // the user declined to answer (Escape)
  // No human can answer here: a headless client, or a client with no
  // renderer for this kind. Never a user decision.
  PROMPT_OUTCOME_UNAVAILABLE = 3;
}

message PluginPromptRequest {
  // Server-generated, same correlation rationale as PermissionRequest.
  string request_id = 1;
  // Which prompt renderer draws this, e.g. "ask". Plugin-defined.
  string kind = 2;
  // The plugin's own request, serialized JSON. Core never parses it.
  string payload_json = 3;
}

message PluginPromptResponse {
  string request_id = 1; // echoes the server-generated id from PluginPromptRequest
  PromptOutcome outcome = 2;
  // The renderer's answer, serialized JSON; meaningful only when ANSWERED.
  // The tool that asked validates it against its own request.
  string answer_json = 3;
}

message CancelTurn {
  // True ALSO drops every turn still sitting in the session's work queue
  // (messages submitted while the agent was mid-turn, not yet started). The
  // in-flight turn unwinds as cancelled either way. Each dropped queued turn
  // is announced by a TurnCanceledEvent so every attached client can retire
  // its pending echo.
  bool include_queued = 1;
}

// Cancels ONE queued (not yet started) turn by the id TurnQueuedEvent
// assigned it. Always answered by a TurnCanceledEvent for that id --
// removed=false means the turn had already been popped and must run (the
// caller keeps, or re-derives, its pending echo).
message CancelQueuedTurn {
  uint64 turn_id = 1;
}

// Names the stream without submitting any work. This is how a client ATTACHES
// to a session it has no turn for -- a subagent child announced by
// SubagentStartedEvent. Attaching is a client protocol obligation (see
// ARCHITECTURE.md "Session lifetime"): a child no client attaches to is
// terminated by the initial-attach guard. Before this message existed the
// stream could only be named by an event that did something (a turn, a cancel),
// so the obligation was inexpressible.
message Attach {}

// --- Session traversal (rewind) ---
//
// Discards the ACTIVE transcript from `target_seq` onward. The target must be
// the seq of an active, text-bearing user message and the cut lands BEFORE it
// (the edit-your-previous-prompt model): that user message and everything
// after it leave the conversation, and the client re-sends the edited prompt.
//
// Discard is a MARK, not a delete: a later redo restores the tail, and the
// first real append after the rewind -- the fork -- reclaims it permanently
// (the reclaim rides the append's own transaction, so a crash before it keeps
// redo alive and a crash after it leaves the fork standing).
//
// Mutating, so like a turn or a mutating command it is queued for the session
// worker and runs at a turn boundary -- never between a tool_use and its
// tool_result. Refusals come back as ErrorEvents, never as silence.
message RewindRequest {
  oneof action {
    // Rewind: discard every active message with seq >= target_seq.
    int64 target_seq = 1;
    // Redo: restore the tail the most recent rewind discarded. Valid only
    // while nothing has been appended since -- after the fork the rows are
    // gone and redo answers "nothing to redo".
    bool redo = 2;
  }
}

// How a client ends its stream, explicitly. The stream's session_id already
// names the target; the mode decides what happens to it.
message EndSession {
  enum Mode {
    MODE_UNSPECIFIED = 0;
    // Stop the session now (the in-flight turn unwinds as cancelled). Same
    // outcome as the old v1 semantics for every stream close.
    TERMINATE = 1;
    // Leave the session running with this stream detached: the turn keeps
    // going, output lands in the SQLite transcript, and a later client
    // re-attaches (or resumes) to pick it up.
    DETACH = 2;
  }
  Mode mode = 1;
}

message ClientEvent {
  reserved 11;
  reserved "ask_response"; // replaced by plugin_prompt_response
  // Redundant on every message rather than bound once via stream metadata —
  // trades a few bytes for messages that are self-describing on their own
  // (simpler to log/replay/test than reconstructing context from call metadata).
  string session_id = 1;
  oneof payload {
    UserChatTurn chat_turn = 2;
    CommandInvocation command = 3;
    PermissionResponse permission_response = 4;
    ConfirmationResponse confirmation_response = 5;
    PluginPromptResponse plugin_prompt_response = 14;
    CancelTurn cancel = 6;
    Attach attach = 7;
    RewindRequest rewind = 8;
    EndSession end_session = 9;
    // Shift+tab's direct run-mode switch: no command, no confirmation --
    // the keybinding IS the confirmation. Applied at a turn boundary by the
    // session worker (SetRunMode is worker-thread-only); a full
    // SessionMetadataEvent announces the new mode to every subscriber.
    SetRunModeEvent set_run_mode = 10;
    CancelQueuedTurn cancel_queued_turn = 12;
    // Alt+p (or /pause // /resume): direct pause switch, same shape as the
    // run-mode event -- no command, no confirmation; the keybinding IS the
    // confirmation. Set on the reader thread (an atomic flag), because a
    // mutating command would only land at a turn boundary and could never
    // stop a running turn. See ARCHITECTURE.md "Pause".
    SetPausedEvent set_paused = 13;
  }
}

// A client-driven pause toggle (session.paused). While paused, the agent
// stops at the earliest clean boundary: the tool round in flight when the
// pause lands runs to completion and its REAL results are persisted -- the
// stop point is the tool-call return, never mid-round -- and the turn ends
// STOP_REASON_PAUSED before the next provider call. The model therefore sees
// the tool results only at resume. While paused the worker holds turns and
// wake-turns (commands and rewinds still run); a user turn auto-resumes
// (sessions.pause_auto_resume_on_submit), and an explicit unpause with
// nothing queued runs a seedless continuation turn off the persisted tool
// results. Reboot-safe by construction: nothing waits on a live process,
// the transcript alone is sufficient.
message SetPausedEvent {
  bool paused = 1;
}

// A client-driven permission run-mode change (normal | bypass | allow-only).
message SetRunModeEvent {
  PermissionRunMode run_mode = 1;
}

// Stream lifecycle (S5): a bare stream drop DETACHES -- a crashed terminal
// must not destroy in-flight work. Explicit EndSession{TERMINATE} stops the
// session; EndSession{DETACH} is the graceful version of a drop. A session no
// client ever attaches to is still terminated by the initial-attach guard
// (~10 s), and a detached session is eventually collected by the idle reaper
// (sessions.detached_idle_ttl_seconds) once it has been fully quiescent --
// no turn, no background tasks, no subagent children -- for that long.
// See ARCHITECTURE.md -- Session lifetime.

// --- Server -> client payloads ---

// A session-scoped grant the prompt may offer ("allow /usr/bin/make * this
// session"). Mirrors tools::GrantOffer. A grant is BLANKET permission for its
// key -- any arguments -- and the client's wording must say so; see
// ARCHITECTURE.md "Consent scoping" for why argument-level patterns are not
// offered. Grants are never persisted: they live in the server's ToolExecutor
// for the session and nowhere else.
message GrantOffer {
  string key = 1;   // stable, e.g. "bash:/usr/bin/make" -- what gets remembered
  string label = 2; // human-facing, e.g. "/usr/bin/make *"
}

message PermissionRequest {
  // Server-generated. Tool dispatch is sequential in v1 so only one is normally
  // outstanding per session, but correlation is required regardless: a client
  // multiplexing several sessions (tabs) can hold several at once, and parallel
  // dispatch is a planned change.
  string request_id = 1;
  string tool_name = 2;
  ToolCategory category = 3;
  // Currently unconsumed by clients (producer-only): the raw invocation input
  // is available to server-side policy and plugins; clients render `summary`
  // instead. Kept for wire compatibility.
  google.protobuf.Struct tool_input = 4;
  string summary = 5; // one-line human-readable description for the prompt
  // What this invocation was able to name, and therefore which grants may be
  // offered. May be a LOWER BOUND -- `find . | xargs rm` names find and xargs,
  // never rm -- so a client must not present it as an exhaustive account of what
  // the command will do.
  repeated GrantOffer grants = 6;
  // False when the invocation cannot be named at all (bash: `eval "$X"`). Such a
  // request can never be satisfied by held grants, so it always prompts.
  bool complete = 7;
  // Why this call asks: the rule that resolved it to "ask" -- e.g.
  // "preset: execute=ask", "pattern `git push *`=ask", "outside the project:
  // out_of_workdir=ask". Display text, never parsed.
  string reason = 8;
}

message ConfirmationRequest {
  string request_id = 1; // server-generated, same correlation rationale as PermissionRequest
  string kind = 2;       // "tool_permission" | "command_confirmation"
  string title = 3;
  string detail = 4;
  repeated string options = 5;
}

enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_OK = 1;
  COMMAND_STATUS_ERROR = 2;
}

// The /-command taxonomy (docs/EXTENSIBILITY.md 4.4). The server derives it
// from the command's C++ type -- HarnessCommand, LLMCommand,
// PromptShorthandCommand -- not from a flag, because the distinction is about
// what the command IS.
enum CommandKind {
  COMMAND_KIND_UNSPECIFIED = 0;
  COMMAND_KIND_HARNESS = 1;            // never touches the conversation path
  COMMAND_KIND_LLM = 2;                // issues its own provider request (/compact)
  COMMAND_KIND_PROMPT_SHORTHAND = 3;   // submits an interpolated prompt as the
                                       // user turn -- the ONLY kind whose content
                                       // reaches the model, and it reaches it as
                                       // the turn itself, never as a result.
}

// Where a CommandResult surfaces -- never the chat (EXTENSIBILITY.md 4.4:
// results are appended to no history and reach no provider; the one client-side
// violation was routing them into the chat).
enum CommandDisplay {
  COMMAND_DISPLAY_UNSPECIFIED = 0;
  COMMAND_DISPLAY_STATUS = 1;  // ephemeral notice line (errors too, styled as errors)
  COMMAND_DISPLAY_VIEW = 2;    // open/refresh the client view named by view_hint
  COMMAND_DISPLAY_SILENT = 3;  // status-bar segment only; no transient line
}

message CommandResult {
  string request_id = 1; // echoes CommandInvocation.request_id
  CommandStatus status = 2;
  string message = 3;
  CommandDisplay display = 4;
  // Non-empty only when display == VIEW: the client view id to open/refresh.
  string view_hint = 5;
  // True iff this is a successful PromptShorthandCommand result (a /-command
  // that translates into a turn, e.g. a commands-md shorthand): the command
  // has already returned, but the TURN it queued is still running and its
  // output arrives as ordinary events on this same stream (deltas, tool
  // calls, a TurnCompletedEvent), never as part of this CommandResult. A
  // reader that stops at CommandResult -- the ordinary rule for every other
  // command -- must instead keep reading (or re-attach) until that turn
  // completes, or it observes none of it. See minimal::commands::CommandResult
  // in command.hpp for the server-side derivation.
  bool submitted_turn = 6;
}

// One row of ListCommands: everything the prompt editor needs to render
// /-autocomplete without executing anything.
message CommandInfo {
  string name = 1;
  string summary = 2;
  // Currently unconsumed by clients (reserved): autocomplete and /help render
  // summary/name only. Kept for wire compatibility.
  string usage = 3;
  CommandKind kind = 4;
  // Currently unconsumed by clients (reserved): the display decision is taken
  // from CommandResult.display at outcome time, not from the catalog. Kept
  // for wire compatibility.
  CommandDisplay display = 5;
  bool read_only = 6;
  // The Command::RequiresSession taxonomy answer: whether Execute needs a live
  // session ref. The client filters these OUT of /-autocomplete and the /help
  // overlay while the focused tab has no session (a sessionless tab), so a
  // command that would only refuse server-side is never even offered.
  bool requires_session = 7;
}

// A command invocation that needs no session at all: dispatched with a null
// session ref, executed like the read-only fast path (no worker, no queue,
// nothing appended -- commands never reach the conversation anyway). Only a
// Sessionless<> command passes the dispatcher's guard; anything else answers
// with an error result rather than a gRPC error, so clients can surface the
// refusal on their notice line like any other command outcome.
message RunSessionlessCommandRequest {
  string name = 1;
  CommandArgs args = 2;
}

// Reuses CommandResult (request_id stays empty: the unary round-trip needs no
// echo). display/view_hint are shaped for THIS invocation, exactly as the
// on-stream path shapes them.
message RunSessionlessCommandResponse {
  CommandResult result = 1;
}

message ListCommandsRequest {
  // Optional. When set, the response also includes commands registered for
  // THIS project root (commands-md's <project_root>/commands/ and
  // .opencode/commands/, discovered lazily on first use for the root -- see
  // ProjectCommandSource) alongside the global catalog. Empty means global
  // only, the historical behavior. A project entry may shadow a global one
  // of the same name, matching how a project's own agents/<name>.md already
  // shadows a global preset.
  string project_root = 1;
  // Optional, and preferred over project_root when set: the project root is
  // THIS session's own (a client need not track it per tab). An unknown id
  // falls back to project_root.
  string session_id = 2;
}

message ListCommandsResponse {
  repeated CommandInfo commands = 1;
}

// Emitted on the PARENT session's stream when a subagent is spawned.
//
// Attaching to the child session is a CLIENT PROTOCOL OBLIGATION, not a TUI
// behavior: a session that is never attached is terminated by the initial-attach
// guard (~10s). Headless clients must attach too, and may merge or discard the
// child's output. `blocking` drives the TUI's auto-focus rule -- the parent is
// stuck waiting on a blocking child, so its tab takes focus.
message SubagentStartedEvent {
  string child_session_id = 1;
  // Consumed as the child tab's fallback title while the session is unnamed
  // (subagent rows are created nameless); a real SessionMetadataEvent name
  // supersedes it.
  string task = 2;
  bool blocking = 3;
}

// Session metadata changed server-side (e.g. a SessionObserver plugin replaced
// the default truncated-first-message name with an LLM-generated title), so
// tab labels and the session picker must refresh.
//
// Emitted once when a stream opens (create/attach/resume) so a freshly attached
// tab has everything the status bar renders, and re-emitted whenever a field
// changes. Fields beyond `name` are the E additions that give {model}, {agent}
// and {permission_mode} their wire source; context_window_tokens is the
// resolved session maximum (compaction's window), the `max` half of {tokens}.
message SessionMetadataEvent {
  string session_id = 1;
  string name = 2;
  string agent_preset = 3;
  // "<provider>/<model>" as resolved for this session.
  string model = 4;
  // Mirrors tools::PermissionRunMode as a string (e.g. "normal") -- the status
  // bar renders text, and a new enum value would need a wire release to be
  // renderable.
  string permission_mode = 5;
  // The session's context window in tokens, resolved from providers.json or
  // discovery. 0 = unknown; the status bar renders nothing for it, matching
  // the unknown-segment rule.
  int64 context_window_tokens = 6;
  // The pause state (SetPausedEvent). Announced on change like the other
  // fields so every attached tab's status bar can render it.
  bool paused = 7;
}
// One turn reached a natural stop. The stream stays OPEN -- the client may send
// another turn on it -- so this is not a stream terminator; it is the only thing
// that tells a client the server is done talking for now.
//
// Without it a single-turn client cannot know when to half-close, and both sides
// block: the client waiting for output that will never come, the server waiting
// for a turn that will never be sent. An interactive client never notices,
// because a human decides when the conversation is over; `minimal -p` has no
// human, which is why building it first is what found this.
//
// StopReason alone is not a substitute: a turn contains one message_delta per
// provider call, so a tool-using turn emits several before it is actually done.
message TurnCompletedEvent {
  StopReason stop_reason = 1;
  Usage usage = 2;
  bool hit_max_turns = 3;
  // True when `usage` is the server's bytes/4 estimate rather than a
  // backend-reported count (some OpenAI-compatible proxies report zero
  // usage). Render it, don't price it.
  bool usage_estimated = 4;
}

// Lifecycle of a BACKGROUND task -- work (background bash) whose process
// outlives the tool call that spawned it. STARTED arrives on the spawning
// session's stream before the ack ToolResult does; the terminal states arrive
// whenever the task finishes, possibly several turns later.
//
// `tool_use_id` is the ORIGINAL invocation: the task's live output streams as
// ToolOutputDeltaEvents under that same id, so a client keys its running-tools
// row by tool_use_id and labels it from this event. The authoritative result
// reaches the MODEL as an injected message at a turn boundary, not through
// this event -- this channel is the operator's status display.
message BackgroundTaskEvent {
  enum State {
    STARTED = 0;
    COMPLETED = 1;   // exit status 0
    FAILED = 2;      // non-zero exit or killed by a signal
    TIMED_OUT = 3;   // the task's wall-clock deadline; process group killed
    KILLED = 4;      // the session terminated; the watcher killed the group
  }
  string task_id = 1;
  string tool_use_id = 2;
  string command = 3;
  // Producer-only/reserved for diagnostics: clients key rows by tool_use_id
  // and read command/state; pid and task_id are not consumed. Kept for wire
  // compatibility.
  int32 pid = 4;
  State state = 5;
}

// The session's transcript was rewound or redone. The client trims its
// scrollback to the ACTIVE transcript (messages with seq <= active_last_seq,
// which is -1 when the transcript is now empty) and clears any streaming or
// pending-turn state for the session. Not a turn terminator: no
// TurnCompletedEvent accompanies it.
message SessionRewoundEvent {
  // The seq the cut landed before -- the target of the RewindRequest. -1 for a
  // redo, which restores rather than cuts.
  int64 truncated_to_seq = 1;
  // MAX(seq) over the ACTIVE transcript after the operation, or -1 when empty.
  int64 active_last_seq = 2;
}

// The session was TERMINATED server-side. Additive on purpose: a session can be
// killed while a client is attached to it -- a child whose blocking spawn was
// cancelled, a reaper eviction, server shutdown -- and before this event the
// attached stream simply went silent, so the client could not distinguish
// "killed" from "finished quietly". Presence of the event IS the signal; there
// is no reason taxonomy yet because every terminate path means the same thing
// to a client: this session will produce nothing further.
//
// Emitted on EVERY terminate path, before the queue closes, so the writer
// drains it. It does not replace TurnCompletedEvent: a session that finished
// its turn normally still ends with turn_completed, then ends (stream close).
message SessionEndedEvent {}

// This subscriber's event stream has a HOLE: the durable record is the
// transcript in SQLite, events are ephemeral notifications, and this client
// missed some of them. The response is always the same -- refetch the
// transcript through GetMessages (newest page first) and treat nothing seen on
// this stream before this event as complete. Delivered when the broadcaster
// had to drop-oldest into this subscriber's queue (overflow), or when a client
// attaches to a session that already had a subscriber (late_attach): the
// transcript is authoritative for everything either of them missed.
message ResyncRequiredEvent {
  // "overflow" (this subscriber's queue overflowed and oldest events were
  // evicted) or "late_attach" (another client was attached to this session
  // before this one). Informational -- the client action is identical.
  string reason = 1;
}

// S5.3: a permission_request, confirmation_request, or plugin_prompt this
// session broadcast to every subscriber has been answered by ONE of them
// (first answer wins). Delivered to every subscriber, including the one that
// answered -- clearing an already-cleared prompt is a no-op there -- so every
// OTHER client's modal for this request_id dismisses instead of sitting on a
// dead question.
message PromptResolvedEvent {
  string request_id = 1;
}

message ServerEvent {
  reserved 17;
  reserved "ask_request"; // replaced by plugin_prompt
  // Which session this event belongs to. Required because one client multiplexes
  // several sessions (tabs), including subagent children of the focused session.
  string session_id = 1;
  oneof payload {
    StreamEvent stream_event = 2;                 // token/tool-call deltas during a turn
    ToolExecutionEvent tool_execution = 3;          // non-gated "running tool X..." status
    ToolOutputDeltaEvent tool_output_delta = 4;     // live (tail-only) tool stdout
    PermissionRequest permission_request = 5;       // blocks server-side until answered
    ConfirmationRequest confirmation_request = 6;   // blocks server-side until answered
    CommandResult command_result = 7;
    SubagentStartedEvent subagent_started = 8;
    SessionMetadataEvent session_metadata = 9;
    ErrorEvent error = 10;
    TurnCompletedEvent turn_completed = 11;
    BackgroundTaskEvent background_task = 12;
    SessionRewoundEvent session_rewound = 13;
    SessionEndedEvent session_ended = 14;
    ResyncRequiredEvent resync_required = 15;
    PromptResolvedEvent prompt_resolved = 16;
    PluginPromptRequest plugin_prompt = 21;         // blocks server-side until answered
    // A turn was ACCEPTED onto the session's work queue (not yet running --
    // the seed user row persists only when the worker pops it). Turn ids are
    // per-session monotonic; the text echoes the submission so a client can
    // correlate it with its optimistic echo. Broadcast to every subscriber.
    //
    // steered=true: the turn arrived while the agent was mid-turn and rides
    // REAL-TIME STEERING instead -- it was staged onto the injection queue and
    // will be appended at the next tool-result boundary of the RUNNING turn,
    // reaching the model as [..., tool_result, steering] in the very next
    // request. It never occupies the work queue: CancelQueuedTurn does not
    // apply (a client should hide the cancel affordance), and the transcript
    // row appears when the boundary flush lands it, not at submit.
    TurnQueuedEvent turn_queued = 18;
    // A queued turn left the work queue without running: cancelled by id
    // (CancelQueuedTurn) or in a queue flush (CancelTurn{include_queued}).
    // removed=false answers a CancelQueuedTurn whose turn had already been
    // popped -- it must run, and the pending echo stays until its own row
    // lands in a fetched page.
    TurnCanceledEvent turn_canceled = 19;
    // The session's working context was compacted: the oldest part of the
    // history was replaced by one summary message. Transcript rows are
    // untouched (compaction rewrites only the model's working set), so this
    // event is the only live signal -- the same record also rides
    // GetMessagesResponse.compactions for scrollback and resume.
    CompactionEvent compaction = 20;
  }
}

// One context compaction. at_seq is the last transcript seq when it ran (a
// client renders it right after that message); boundary_seq is the last seq
// the summary replaced. Token figures are whole-context sizes, both the
// server's bytes/4 estimate (one basis, so the two compare).
message CompactionEvent {
  int64 at_seq = 1;
  int64 boundary_seq = 2;
  int64 folded_messages = 3;
  int64 tokens_before = 4;
  int64 tokens_after = 5;
  string summary = 6;      // the summary text the model now sees, markdown
  string trigger = 7;      // "auto" | "manual"
  int64 created_at_unix_ms = 8;
  // A sanity guard's message: why this compaction was skipped (skipped =
  // true: nothing folded, no summary), or why a completed one looks
  // ineffective. Empty when there is nothing to say.
  string warning = 9;
  bool skipped = 10;
}

message TurnQueuedEvent {
  uint64 turn_id = 1;
  string text = 2;
  // True when the turn was STEERED (see the turn_queued field comment above):
  // it is on the injection path of the in-flight turn, not the work queue.
  bool steered = 3;
}

message TurnCanceledEvent {
  uint64 turn_id = 1;
  bool removed = 2;
}

// --- Scrollback (separate from the live bidi stream so paging through a
// 512k-1M token history never competes with in-flight turn traffic) ---

message StoredMessage {
  int64 seq = 1;
  Message message = 2;
  // Currently unconsumed by clients (producer-only/reserved): the persisted
  // token tally is available for future budget displays; kept for wire
  // compatibility.
  int32 token_count = 3;
  int64 created_at_unix_ms = 4;
  // Who produced an ASSISTANT message: the agent preset name and the
  // "<provider>/<model>" it ran on, per-turn overrides included. Empty =
  // unknown (user/tool-result rows, and rows persisted before v9).
  string agent_preset = 5;
  string model = 6;
}

message GetMessagesRequest {
  string session_id = 1;
  // Exclusive upper bound. OPTIONAL rather than "0 means most recent", because
  // seq starts at 0: a client paging backwards that reached the first message
  // and passed its seq as the next cursor got the newest page back instead of
  // an empty one. Explicit presence separates "no cursor" from "before the
  // first message", which a sentinel drawn from the value space cannot.
  optional int64 before_seq = 2;
  int32 limit = 3;
  // Exclusive LOWER bound: when set, the response carries every ACTIVE row
  // with seq > after_seq ASCENDING -- a delta fetch ("only the changes").
  // The transcript is append-only with immutable rows, so seq is an exact
  // content address: a client holding rows through seq N never needs the
  // window below N re-sent. Mutually exclusive with before_seq (a request
  // setting both is INVALID_ARGUMENT). On an after_seq response has_more
  // means MORE NEWER rows remain (the page was full), not "older pages
  // exist" -- it must not feed a load-older affordance.
  optional int64 after_seq = 4;
}

message GetMessagesResponse {
  repeated StoredMessage messages = 1; // descending by seq (ascending on an after_seq fetch)
  bool has_more = 2;
  // The compactions that ran at one of this page's seqs (at_seq within the
  // page), ascending by at_seq. Each belongs to exactly one page. An after_seq
  // fetch also includes the compactions at after_seq itself (possibly
  // already held; clients dedupe).
  repeated CompactionEvent compactions = 3;
}

// --- @-mention autocomplete (server-resolved so matching strategy can be
// overridden by a plugin-registered MentionResolver; see ARCHITECTURE.md) ---

message SuggestPathsRequest {
  string session_id = 1;
  string prefix = 2; // text typed after '@' so far
  int32 limit = 3;
  // Sessionless-tab scope: paths are suggested for this project root directly,
  // with no session row involved. Mutually exclusive with session_id -- a
  // request setting both (or neither) is INVALID_ARGUMENT. Root-relative
  // paths in the response follow the same contract as the session scope.
  string project_root = 4;
}

message SuggestPathsResponse {
  repeated string paths = 1; // relative to project_root
}

// --- Session lifecycle (maps to the SQLite `sessions` table) ---

message SessionSummary {
  string session_id = 1;
  string name = 2;
  string agent_preset = 3;
  string project_root = 4;
  int32 message_count = 5;
  int64 created_at_unix_ms = 6;
  int64 updated_at_unix_ms = 7; // doubles as last-activity for picker sorting
  // Producer-only/reserved: the TUI tracks parent/child grouping from
  // SubagentStartedEvent instead, so no client reads this field today. Kept
  // for wire compatibility (and for clients that list subagents directly).
  string parent_session_id = 8;
  // S5.4: true iff a live Session object for this id currently exists in the
  // server's SessionRegistry -- attached OR detached-but-still-running, not
  // the persisted row. Lets the picker offer "attach" (this session is live;
  // its transcript may still be growing) instead of "resume" (load from the
  // stored transcript, the only option before S5) for the same session_id.
  bool is_live = 9;
  // Session FORK provenance (v7 store): the source session this one forked
  // from, empty otherwise. A fork is a top-level peer -- NOT a subagent.
  string forked_from_session_id = 10;
}

message ListSessionsRequest {
  // Defaults to the caller's cwd; the picker filters to the current project.
  string project_root = 1;
  bool include_all_dirs = 2;
  // Subagent sessions (parent_session_id IS NOT NULL) are excluded unless set;
  // they belong in their parent's tab group, not the top-level list.
  bool include_subagents = 3;

  // Page size. 0 takes the server's default (memory.scrollback_page_size), the
  // same treatment GetMessages gives its limit. The list is bounded because it
  // otherwise returns every session ever created, each carrying a COUNT(*) over
  // the messages table -- the picker's query grew without bound while the
  // scrollback query beside it was carefully keyset-paginated.
  int32 limit = 4;

  // Cursor, exclusive, from the last row of the previous page. Both halves are
  // required together: the sort key is (updated_at DESC, id ASC) and updated_at
  // alone is not unique, so a cursor on it would skip or repeat rows at a page
  // boundary.
  optional int64 before_updated_at = 5;
  optional string before_id = 6;
}

message ListSessionsResponse {
  repeated SessionSummary sessions = 1;
}

// One stored row by id. The startup --resume probe's primitive: a client that
// knows a session id (from a previous headless run's session_created line, or
// --list-sessions) needs exactly this row -- liveness (attach vs resume) and
// subagent provenance -- without paging through ListSessions and matching
// client-side. NOT_FOUND for an unknown id; a subagent row answers normally
// (its parent_session_id is set), so a caller can refuse one with a message.
message GetSessionRequest {
  string session_id = 1;
}

// --- Agent preset picker (name + description only; no model/provider
// resolution -- see AgentPresetRegistry::ListAvailable) ---

message AgentPresetSummary {
  string name = 1;
  string description = 2;
  // "#rrggbb" from the preset frontmatter; empty = theme default. Any other
  // value the client ignores rather than guessing.
  string color = 3;
}

message ListAgentPresetsRequest {
  // The requesting session's project root. When set, project-local agents/
  // directories along the git-root walk are merged into the listing (the
  // nearest declaration shadows a global preset of the same name). Empty
  // lists the global config dir only.
  string project_root = 1;
}

message ListAgentPresetsResponse {
  repeated AgentPresetSummary presets = 1;
}

// One selectable model for the /model picker: "<provider>/<model>" plus the
// context window the picker shows for orientation. No `active` flag: the
// status bar already renders the focused session's model from
// SessionMetadataEvent, and liveness of "which model is in force" is
// per-session, not a property of the catalog.
message ModelSummary {
  string ref = 1;
  // 0 = unknown; the picker renders nothing for it, matching the
  // unknown-segment rule the status bar uses.
  int64 context_window_tokens = 2;
}

message ListModelsRequest {
  // Explicit re-fetch of every discover-entry's catalog before listing (the
  // picker's ctrl+r). The bare listing NEVER triggers a fetch: a cold cache
  // lists static models only, and discovery stays lazy at first resolve.
  bool refresh_discovery = 1;
}

message ListModelsResponse {
  repeated ModelSummary models = 1;
}

// Deletes a stored session that no stream has open. The database delete
// cascades to messages and subagent children (session_database.hpp). Refused
// for a session whose stream is open -- the client closes the tab first.
message DeleteSessionRequest {
  string session_id = 1;
}

message DeleteSessionResponse {}

// Mirrors tools::PermissionRunMode. Client-supplied because it is a property of
// the CLIENT, not of the config: the headless client has no human attached, so
// it must ask for ALLOW_ONLY (Ask -> Deny) rather than block forever on a prompt
// nobody can answer, and `--dangerously-bypass` is its explicit opt-out.
// UNSPECIFIED means "use permissions.json default_run_mode".
enum PermissionRunMode {
  PERMISSION_RUN_MODE_UNSPECIFIED = 0;
  PERMISSION_RUN_MODE_ALLOW_ONLY = 1;
  PERMISSION_RUN_MODE_NORMAL = 2;
  PERMISSION_RUN_MODE_BYPASS = 3;
}

message CreateSessionRequest {
  string name = 1;
  string agent_preset = 2;
  // Per-session, not server-global: the boundary for path confinement,
  // @-mentions, SuggestPaths, and bash's initial cwd. The client supplies its cwd.
  string project_root = 3;
  PermissionRunMode run_mode = 4;
  // "<provider>/<model>", empty = whatever the preset resolves to. A model the
  // USER chose outranks the preset's, and keeps outranking it after a later
  // /agent -- the preset supplies a default, not a decision.
  string model = 5;
  // Non-empty means RESUME: reopen this stored session rather than creating a
  // new one. The stored row's name, agent_preset and project_root govern, so
  // those fields must be empty here (the client already has them from
  // ListSessions); run_mode still applies, being a property of the client.
  // The server loads the stored transcript as the loop's working history
  // WITHOUT re-appending it -- the next append continues at MAX(seq) + 1.
  string session_id = 6;
  // Signal subscriptions, in effect for this session's lifetime: selectors
  // "channel" or "channel/signal" (e.g. "ci/build.completed"), plus the
  // builtin "sessions" source for cross-session messages. Validated against
  // channels.json at start -- an unknown channel or signal is
  // INVALID_ARGUMENT, not silence. Non-empty also turns on wake-on-injection
  // for this session: a subscribed session exists to react to signals, so an
  // idle one runs a turn when one arrives (dropped-subscriber semantics only
  // apply to sessions that never subscribed). Re-supplied on resume;
  // subscriptions never persist across a stream.
  repeated string signals = 7;
}

message CreateSessionResponse {
  SessionSummary session = 1;
}

// SESSION FORK: a new top-level session seeded with the source's active
// transcript below target_seq. The source is untouched -- the interesting
// "try it on another model/plan" shape: fork at the current point with a
// model override, experiment there, keep whichever line you like. Forking a
// live mid-turn session is safe; forking a SUBAGENT session is refused.
message ForkSessionRequest {
  string source_session_id = 1;
  // The fork point: everything strictly below it is copied. Must be an
  // active, text-bearing user message -- the same shape a rewind demands.
  int64 target_seq = 2;
  string name = 3;         // empty = the free default-naming rule
  // "<provider>/<model>", empty = the source's own model -- including a
  // model the user pinned there via /model (persisted on the session row),
  // which the fork copies. Set a value here to start the fork on a
  // DIFFERENT model than the source was running.
  string model = 4;
  string agent_preset = 5; // empty = the source's preset
  // UNSPECIFIED = the source's run mode.
  PermissionRunMode run_mode = 6;
}

message ForkSessionResponse {
  SessionSummary session = 1;
}

// --- Generic plugin channel ---
//
// A UI plugin is usually a pair: a server-side data source plus a client-side
// view. Rather than adding a bespoke core RPC per plugin, this carries opaque
// JSON that core neither defines nor interprets.

message PluginCallRequest {
  string plugin_name = 1;
  string method = 2;
  string json_payload = 3;
}

message PluginCallResponse {
  string json_payload = 1;
}

// Client presence heartbeat. A client that is alive but holds no session --
// a TUI sitting on its empty-state welcome view has nothing attached -- sends
// these so the reaper's idle exit (server.idle_shutdown_seconds) does not
// mistake "zero live sessions, zero attached streams" for "nobody is here".
// Carries nothing; the timestamp it refreshes IS the payload.
message PingRequest {}

message PingResponse {}

service SessionService {
  // Primary channel for one open session: user turns in, streamed model output
  // and permission/confirmation/command round-trips out, multiplexed over a
  // single bidirectional stream. Dropping the stream detaches; send
  // EndSession{TERMINATE} to stop the session explicitly (see the message's
  // comment for the full lifecycle).
  rpc OpenSession(stream ClientEvent) returns (stream ServerEvent);

  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);
  rpc GetSession(GetSessionRequest) returns (SessionSummary);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc ListAgentPresets(ListAgentPresetsRequest) returns (ListAgentPresetsResponse);
  // The /model picker's list: every configured or discovered model ref.
  // Read-only against providers.json's resolved contents plus the discovery
  // cache -- a cold cache contributes nothing (a listing never triggers a
  // provider fetch; /providers refresh's eviction role is gone with the
  // command). Server sorts refs ascending.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc ForkSession(ForkSessionRequest) returns (ForkSessionResponse);
  rpc SuggestPaths(SuggestPathsRequest) returns (SuggestPathsResponse);
  // Unary, fetched once at connect: plugins load at startup and config is read
  // once, so the command list cannot change mid-connection -- no invalidation
  // machinery. Without it, plugin commands are invisible to /-autocomplete.
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);
  // Executes a sessionless /-command (Sessionless<> taxonomy): /help,
  // /sessions and their future siblings, runnable before any session exists --
  // what keeps a sessionless tab from minting one just to open a picker.
  rpc RunSessionlessCommand(RunSessionlessCommandRequest)
      returns (RunSessionlessCommandResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);

  // Client presence heartbeat; see PingRequest above.
  rpc Ping(PingRequest) returns (PingResponse);

  rpc PluginCall(PluginCallRequest) returns (PluginCallResponse);
  rpc PluginSubscribe(PluginCallRequest) returns (stream PluginCallResponse);
}
