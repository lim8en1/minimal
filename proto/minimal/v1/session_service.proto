syntax = "proto3";

package minimal.v1;

import "minimal/v1/common.proto";
import "google/protobuf/struct.proto";

// --- Client -> server payloads ---

message UserChatTurn {
  string text = 1; // v1 is text-only; structured content (pasted images, etc.) is future scope
}

message CommandArgs {
  repeated string positional = 1;
  map<string, string> flags = 2;
  string raw = 3;
}

message CommandInvocation {
  string request_id = 1; // client-generated; echoed back on CommandResult
  string name = 2;       // e.g. "compact", without the leading '/'
  CommandArgs args = 3;
}

enum PermissionDecision {
  PERMISSION_DECISION_UNSPECIFIED = 0;
  PERMISSION_DECISION_ALLOW = 1;
  PERMISSION_DECISION_DENY = 2;
}

message PermissionResponse {
  string request_id = 1; // echoes the server-generated id from PermissionRequest
  PermissionDecision decision = 2;
  // Grants the operator chose to remember for this session. Every entry must be
  // a key the corresponding PermissionRequest offered -- the server drops
  // anything else rather than trusting a client to invent grant keys.
  repeated string granted_keys = 3;
}

message ConfirmationResponse {
  string request_id = 1; // echoes the server-generated id from ConfirmationRequest
  string chosen_option = 2;
}

message CancelTurn {} // interrupts the in-flight LLM turn for this session, if any

// Names the stream without submitting any work. This is how a client ATTACHES
// to a session it has no turn for -- a subagent child announced by
// SubagentStartedEvent. Attaching is a client protocol obligation (see
// ARCHITECTURE.md "Session lifetime"): a child no client attaches to is
// terminated by the initial-attach guard. Before this message existed the
// stream could only be named by an event that did something (a turn, a cancel),
// so the obligation was inexpressible.
message Attach {}

message ClientEvent {
  // Redundant on every message rather than bound once via stream metadata —
  // trades a few bytes for messages that are self-describing on their own
  // (simpler to log/replay/test than reconstructing context from call metadata).
  string session_id = 1;
  oneof payload {
    UserChatTurn chat_turn = 2;
    CommandInvocation command = 3;
    PermissionResponse permission_response = 4;
    ConfirmationResponse confirmation_response = 5;
    CancelTurn cancel = 6;
    Attach attach = 7;
  }
}

// Note: there is deliberately no EndSession message. Closing the stream
// terminates the session (see ARCHITECTURE.md -- Session lifetime); detach is
// not supported in v1, so stream closure is unambiguous. A DETACH mode would
// slot in here additively if that changes.

// --- Server -> client payloads ---

// A session-scoped grant the prompt may offer ("allow /usr/bin/make * this
// session"). Mirrors tools::GrantOffer. A grant is BLANKET permission for its
// key -- any arguments -- and the client's wording must say so; see
// ARCHITECTURE.md "Consent scoping" for why argument-level patterns are not
// offered. Grants are never persisted: they live in the server's ToolExecutor
// for the session and nowhere else.
message GrantOffer {
  string key = 1;   // stable, e.g. "bash:/usr/bin/make" -- what gets remembered
  string label = 2; // human-facing, e.g. "/usr/bin/make *"
}

message PermissionRequest {
  // Server-generated. Tool dispatch is sequential in v1 so only one is normally
  // outstanding per session, but correlation is required regardless: a client
  // multiplexing several sessions (tabs) can hold several at once, and parallel
  // dispatch is a planned change.
  string request_id = 1;
  string tool_name = 2;
  ToolCategory category = 3;
  google.protobuf.Struct tool_input = 4;
  string summary = 5; // one-line human-readable description for the prompt
  // What this invocation was able to name, and therefore which grants may be
  // offered. May be a LOWER BOUND -- `find . | xargs rm` names find and xargs,
  // never rm -- so a client must not present it as an exhaustive account of what
  // the command will do.
  repeated GrantOffer grants = 6;
  // False when the invocation cannot be named at all (bash: `eval "$X"`). Such a
  // request can never be satisfied by held grants, so it always prompts.
  bool complete = 7;
}

message ConfirmationRequest {
  string request_id = 1; // server-generated, same correlation rationale as PermissionRequest
  string kind = 2;       // "tool_permission" | "command_confirmation"
  string title = 3;
  string detail = 4;
  repeated string options = 5;
}

enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_OK = 1;
  COMMAND_STATUS_ERROR = 2;
}

message CommandResult {
  string request_id = 1; // echoes CommandInvocation.request_id
  CommandStatus status = 2;
  string message = 3;
}

// Emitted on the PARENT session's stream when a subagent is spawned.
//
// Attaching to the child session is a CLIENT PROTOCOL OBLIGATION, not a TUI
// behavior: a session that is never attached is terminated by the initial-attach
// guard (~10s). Headless clients must attach too, and may merge or discard the
// child's output. `blocking` drives the TUI's auto-focus rule -- the parent is
// stuck waiting on a blocking child, so its tab takes focus.
message SubagentStartedEvent {
  string child_session_id = 1;
  string task = 2;
  bool blocking = 3;
}

// Session metadata changed server-side (e.g. a SessionObserver plugin replaced
// the default truncated-first-message name with an LLM-generated title), so
// tab labels and the session picker must refresh.
message SessionMetadataEvent {
  string session_id = 1;
  string name = 2;
}

// One turn reached a natural stop. The stream stays OPEN -- the client may send
// another turn on it -- so this is not a stream terminator; it is the only thing
// that tells a client the server is done talking for now.
//
// Without it a single-turn client cannot know when to half-close, and both sides
// block: the client waiting for output that will never come, the server waiting
// for a turn that will never be sent. An interactive client never notices,
// because a human decides when the conversation is over; `minimal -p` has no
// human, which is why building it first is what found this.
//
// StopReason alone is not a substitute: a turn contains one message_delta per
// provider call, so a tool-using turn emits several before it is actually done.
message TurnCompletedEvent {
  StopReason stop_reason = 1;
  Usage usage = 2;
  bool hit_max_turns = 3;
}

// Lifecycle of a BACKGROUND task -- work (background bash) whose process
// outlives the tool call that spawned it. STARTED arrives on the spawning
// session's stream before the ack ToolResult does; the terminal states arrive
// whenever the task finishes, possibly several turns later.
//
// `tool_use_id` is the ORIGINAL invocation: the task's live output streams as
// ToolOutputDeltaEvents under that same id, so a client keys its running-tools
// row by tool_use_id and labels it from this event. The authoritative result
// reaches the MODEL as an injected message at a turn boundary, not through
// this event -- this channel is the operator's status display.
message BackgroundTaskEvent {
  enum State {
    STARTED = 0;
    COMPLETED = 1;   // exit status 0
    FAILED = 2;      // non-zero exit or killed by a signal
    TIMED_OUT = 3;   // the task's wall-clock deadline; process group killed
    KILLED = 4;      // the session terminated; the watcher killed the group
  }
  string task_id = 1;
  string tool_use_id = 2;
  string command = 3;
  int32 pid = 4;
  State state = 5;
}

message ServerEvent {
  // Which session this event belongs to. Required because one client multiplexes
  // several sessions (tabs), including subagent children of the focused session.
  string session_id = 1;
  oneof payload {
    StreamEvent stream_event = 2;                 // token/tool-call deltas during a turn
    ToolExecutionEvent tool_execution = 3;          // non-gated "running tool X..." status
    ToolOutputDeltaEvent tool_output_delta = 4;     // live (tail-only) tool stdout
    PermissionRequest permission_request = 5;       // blocks server-side until answered
    ConfirmationRequest confirmation_request = 6;   // blocks server-side until answered
    CommandResult command_result = 7;
    SubagentStartedEvent subagent_started = 8;
    SessionMetadataEvent session_metadata = 9;
    ErrorEvent error = 10;
    TurnCompletedEvent turn_completed = 11;
    BackgroundTaskEvent background_task = 12;
  }
}

// --- Scrollback (separate from the live bidi stream so paging through a
// 512k-1M token history never competes with in-flight turn traffic) ---

message StoredMessage {
  int64 seq = 1;
  Message message = 2;
  int32 token_count = 3;
  int64 created_at_unix_ms = 4;
}

message GetMessagesRequest {
  string session_id = 1;
  // Exclusive upper bound. OPTIONAL rather than "0 means most recent", because
  // seq starts at 0: a client paging backwards that reached the first message
  // and passed its seq as the next cursor got the newest page back instead of
  // an empty one. Explicit presence separates "no cursor" from "before the
  // first message", which a sentinel drawn from the value space cannot.
  optional int64 before_seq = 2;
  int32 limit = 3;
}

message GetMessagesResponse {
  repeated StoredMessage messages = 1; // descending by seq
  bool has_more = 2;
}

// --- @-mention autocomplete (server-resolved so matching strategy can be
// overridden by a plugin-registered MentionResolver; see ARCHITECTURE.md) ---

message SuggestPathsRequest {
  string session_id = 1;
  string prefix = 2; // text typed after '@' so far
  int32 limit = 3;
}

message SuggestPathsResponse {
  repeated string paths = 1; // relative to project_root
}

// --- Session lifecycle (maps to the SQLite `sessions` table) ---

message SessionSummary {
  string session_id = 1;
  string name = 2;
  string agent_preset = 3;
  string project_root = 4;
  int32 message_count = 5;
  int64 created_at_unix_ms = 6;
  int64 updated_at_unix_ms = 7; // doubles as last-activity for picker sorting
  // Empty for a top-level session. Without it, ListSessions with
  // include_subagents set returns rows the client cannot tell apart from
  // top-level ones, which makes the flag useless.
  string parent_session_id = 8;
}

message ListSessionsRequest {
  // Defaults to the caller's cwd; the picker filters to the current project.
  string project_root = 1;
  bool include_all_dirs = 2;
  // Subagent sessions (parent_session_id IS NOT NULL) are excluded unless set;
  // they belong in their parent's tab group, not the top-level list.
  bool include_subagents = 3;

  // Page size. 0 takes the server's default (memory.scrollback_page_size), the
  // same treatment GetMessages gives its limit. The list is bounded because it
  // otherwise returns every session ever created, each carrying a COUNT(*) over
  // the messages table -- the picker's query grew without bound while the
  // scrollback query beside it was carefully keyset-paginated.
  int32 limit = 4;

  // Cursor, exclusive, from the last row of the previous page. Both halves are
  // required together: the sort key is (updated_at DESC, id ASC) and updated_at
  // alone is not unique, so a cursor on it would skip or repeat rows at a page
  // boundary.
  optional int64 before_updated_at = 5;
  optional string before_id = 6;
}

message ListSessionsResponse {
  repeated SessionSummary sessions = 1;
}

// Mirrors tools::PermissionRunMode. Client-supplied because it is a property of
// the CLIENT, not of the config: the headless client has no human attached, so
// it must ask for ALLOW_ONLY (Ask -> Deny) rather than block forever on a prompt
// nobody can answer, and `--dangerously-bypass` is its explicit opt-out.
// UNSPECIFIED means "use permissions.json default_run_mode".
enum PermissionRunMode {
  PERMISSION_RUN_MODE_UNSPECIFIED = 0;
  PERMISSION_RUN_MODE_ALLOW_ONLY = 1;
  PERMISSION_RUN_MODE_NORMAL = 2;
  PERMISSION_RUN_MODE_BYPASS = 3;
}

message CreateSessionRequest {
  string name = 1;
  string agent_preset = 2;
  // Per-session, not server-global: the boundary for path confinement,
  // @-mentions, SuggestPaths, and bash's initial cwd. The client supplies its cwd.
  string project_root = 3;
  PermissionRunMode run_mode = 4;
  // "<provider>/<model>", empty = whatever the preset resolves to. A model the
  // USER chose outranks the preset's, and keeps outranking it after a later
  // /agent -- the preset supplies a default, not a decision.
  string model = 5;
  // Non-empty means RESUME: reopen this stored session rather than creating a
  // new one. The stored row's name, agent_preset and project_root govern, so
  // those fields must be empty here (the client already has them from
  // ListSessions); run_mode still applies, being a property of the client.
  // The server loads the stored transcript as the loop's working history
  // WITHOUT re-appending it -- the next append continues at MAX(seq) + 1.
  string session_id = 6;
}

message CreateSessionResponse {
  SessionSummary session = 1;
}

// --- Generic plugin channel ---
//
// A UI plugin is usually a pair: a server-side data source plus a client-side
// view. Rather than adding a bespoke core RPC per plugin, this carries opaque
// JSON that core neither defines nor interprets.

message PluginCallRequest {
  string plugin_name = 1;
  string method = 2;
  string json_payload = 3;
}

message PluginCallResponse {
  string json_payload = 1;
}

service SessionService {
  // Primary channel for one open session: user turns in, streamed model output
  // and permission/confirmation/command round-trips out, multiplexed over a
  // single bidirectional stream. Closing the stream terminates the session.
  rpc OpenSession(stream ClientEvent) returns (stream ServerEvent);

  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc SuggestPaths(SuggestPathsRequest) returns (SuggestPathsResponse);

  rpc PluginCall(PluginCallRequest) returns (PluginCallResponse);
  rpc PluginSubscribe(PluginCallRequest) returns (stream PluginCallResponse);
}
