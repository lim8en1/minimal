# Build and test on macOS and Linux: ./configure (vcpkg pinned to vcpkg.json's
# builtin-baseline), build with the test binaries, ctest. The vcpkg binary
# cache is kept across runs; a cold one rebuilds grpc and friends, which takes
# most of an hour.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR supersedes its running build. On main nothing is
# cancelled: a run there may be hours into a cold dependency build (and a
# manual run shares the group), so later runs queue behind it instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes bill at 10x on a private repo: pushes and PRs build
        # Linux only; a manual run (Actions -> ci -> Run workflow) adds macOS.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-24.04", "macos-15"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      # Runner images ship their own vcpkg; ./configure bootstraps .vcpkg/ at
      # the pinned baseline instead.
      VCPKG_ROOT: ""
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - uses: actions/checkout@v4

      # The stock image leaves ~14 GB free; a cold vcpkg build (grpc and
      # friends) plus the build tree exhausts it and the runner itself dies
      # mid-Configure. Preinstalled toolchains this build never uses go first.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # clang-tidy enables the policy_constants test.
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config zip unzip tar curl clang-tidy

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config autoconf automake libtool

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'cmake/ports/**', 'cmake/triplets/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'cmake/ports/**', 'cmake/triplets/**') }}-
            vcpkg-${{ matrix.os }}-

      - name: Configure
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          ./configure

      # Saved even when Configure fails or times out: vcpkg stores each
      # package as it finishes, so a cold build that runs out of time still
      # banks what it built and the next run resumes from there. Cache entries
      # are immutable, hence the run id in the key: under a fixed key the
      # first (partial) save would win forever. Old entries age out (LRU).
      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'cmake/ports/**', 'cmake/triplets/**') }}-${{ github.run_id }}

      - name: Build
        run: cmake --build --preset default --target all minimal_test_binaries

      - name: Test
        run: ctest --preset default
