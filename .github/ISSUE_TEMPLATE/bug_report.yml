name: Bug report
description: Something behaves wrongly, crashes, or leaks.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through private reporting instead -- see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows it -- commands, prompts, config.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `minimal-server --version`, or the commit you built.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: e.g. Ubuntu 24.04 x86_64, macOS 15 arm64
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config and plugins
      description: Provider, enabled or third-party plugins, non-default settings. Remove API keys.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server log lines around the problem, with any secrets removed.
      render: text
